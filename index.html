<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triple School Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDcHNc3wuECr_obd7BneB_8ZvqP5EdkQyY",
      authDomain: "triple-school-tracker.firebaseapp.com",
      projectId: "triple-school-tracker",
      storageBucket: "triple-school-tracker.firebasestorage.app",
      messagingSenderId: "156047796789",
      appId: "1:156047796789:web:b945a1b1e7426f86a71f7c",
      measurementId: "G-GPH6FW4PTB"
    };

    let db = null;
    let firebaseReady = false;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      if (!firebaseConfig.apiKey.includes('YOUR_')) firebaseReady = true;
    } catch(e) { console.warn('Firebase not configured'); }

    window.__db = db;
    window.__firebaseReady = firebaseReady;
    window.__fsModules = { collection, doc, setDoc, getDocs, deleteDoc, query, where, onSnapshot };
    window.__firebaseLoaded = true;
    document.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    :root {
      --ink: #1a1a18; --paper: #f5f2eb; --cream: #ede9df;
      --olive: #6b7c4e; --olive-light: #a8b88a; --rust: #b85c38;
      --muted: #8a8578; --border: #d4cfc4; --white: #faf8f4;
      --radius: 4px;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'DM Mono', monospace;
      --font-sans: 'Pretendard', system-ui, sans-serif;
      /* school colors */
      --gospel-bg: #eef3f7; --gospel-fg: #2c5f8a;
      --disciple-bg: #f0f4ec; --disciple-fg: #3d6b32;
      --calling-bg: #fdf3ee; --calling-fg: #8b4a2b;
    }
    [data-theme="dark"] {
      --ink:#f0ebe2; --paper:#141412; --cream:#1e1c19;
      --olive:#a8b88a; --olive-light:#6b7c4e; --rust:#d4866a;
      --muted:#6a6460; --border:#2e2c28; --white:#1a1816;
      --gospel-bg:#1a2530; --gospel-fg:#7ab8e8;
      --disciple-bg:#1a2416; --disciple-fg:#7aaa6a;
      --calling-bg:#2a1a12; --calling-fg:#d4866a;
    }
    [data-theme="navy"] {
      --ink:#e8eaf0; --paper:#0d1117; --cream:#161b22;
      --olive:#58a6ff; --olive-light:#1f6feb; --rust:#f78166;
      --muted:#6e7681; --border:#30363d; --white:#13171f;
    }
    [data-theme="rose"] {
      --ink:#2d1f24; --paper:#fdf0f2; --cream:#f7dde3;
      --olive:#c0576e; --olive-light:#e8a0b0; --rust:#8b3a4e;
      --muted:#9a7880; --border:#e8c8cf; --white:#fff5f7;
    }
    [data-theme="forest"] {
      --ink:#1c2416; --paper:#f0f4ec; --cream:#e2ebda;
      --olive:#3d6b32; --olive-light:#7aaa6a; --rust:#8b5a2b;
      --muted:#7a8c72; --border:#c8d8be; --white:#f8fbf5;
    }
    [data-theme="slate"] {
      --ink:#e2e8f0; --paper:#0f172a; --cream:#1e293b;
      --olive:#94a3b8; --olive-light:#64748b; --rust:#f59e0b;
      --muted:#64748b; --border:#334155; --white:#1e293b;
    }

    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);min-height:100vh;font-size:14px;line-height:1.6;transition:background .3s,color .3s;}

    .app{display:flex;flex-direction:column;min-height:100vh;}
    .screen{display:none;flex:1;}
    .screen.active{display:flex;flex-direction:column;}

    /* TOP BAR */
    .top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:0;z-index:100;}
    .top-bar-title{font-family:var(--font-serif);font-size:18px;letter-spacing:-.3px;}
    .top-bar-right{display:flex;gap:8px;align-items:center;}
    .badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;padding:3px 8px;border-radius:2px;background:var(--olive);color:white;text-transform:uppercase;}
    .badge.leader{background:var(--rust);}

    /* NAV */
    .bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--white);position:sticky;bottom:0;}
    .nav-btn{flex:1;padding:12px 8px;border:none;background:none;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .15s;}
    .nav-btn.active{color:var(--ink);}
    .nav-btn svg{width:18px;height:18px;}

    /* LOGIN */
    #screen-login{justify-content:center;align-items:center;padding:32px 24px;background:var(--paper);}
    .login-wrap{width:100%;max-width:380px;}
    .login-title{font-family:var(--font-serif);font-size:42px;line-height:1;letter-spacing:-1px;margin-bottom:4px;}
    .login-sub{color:var(--muted);font-size:13px;margin-bottom:32px;}

    .form-group{margin-bottom:16px;}
    label{display:block;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px;}
    input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--white);color:var(--ink);font-family:var(--font-sans);font-size:14px;outline:none;transition:border-color .15s;}
    input:focus,select:focus{border-color:var(--olive);}

    .role-chips,.step-chips{display:flex;gap:8px;flex-wrap:wrap;}
    .role-chip,.step-chip{flex:1;min-width:70px;padding:9px 6px;border:1px solid var(--border);border-radius:var(--radius);background:var(--white);font-family:var(--font-mono);font-size:11px;cursor:pointer;text-align:center;transition:all .15s;color:var(--muted);}
    .role-chip.selected,.step-chip.selected{border-color:var(--olive);background:var(--olive);color:white;}

    .btn-primary{width:100%;padding:12px;margin-top:24px;background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius);cursor:pointer;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;transition:opacity .15s;}
    .btn-primary:hover{opacity:.85;}
    .offline-note{margin-top:16px;padding:10px 12px;background:var(--cream);border-radius:var(--radius);font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center;}

    /* STEP INFO BOX */
    .step-info{margin-top:12px;padding:10px 12px;background:var(--cream);border-radius:var(--radius);font-size:12px;color:var(--muted);border-left:3px solid var(--olive);display:none;}
    .step-info.visible{display:block;}

    /* NOTICE */
    .notice-banner{background:var(--cream);border-bottom:1px solid var(--border);padding:10px 16px;display:none;}
    .notice-banner.visible{display:block;}
    .notice-banner-title{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--olive);margin-bottom:4px;}
    .notice-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
    .notice-item:last-child{border-bottom:none;}
    .notice-item-title{font-weight:600;margin-bottom:2px;}
    .notice-item-body{color:var(--muted);font-size:12px;}
    .notice-item-meta{font-family:var(--font-mono);font-size:10px;color:var(--border);margin-top:3px;}

    /* FILTER BAR */
    .filter-bar{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--white);scrollbar-width:none;}
    .filter-bar::-webkit-scrollbar{display:none;}
    .filter-chip{flex-shrink:0;padding:5px 12px;border:1px solid var(--border);border-radius:20px;background:none;cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--muted);transition:all .15s;white-space:nowrap;}
    .filter-chip.active{border-color:var(--ink);background:var(--ink);color:var(--paper);}
    .filter-chip.gospel.active{border-color:var(--gospel-fg);background:var(--gospel-fg);color:white;}
    .filter-chip.disciple.active{border-color:var(--disciple-fg);background:var(--disciple-fg);color:white;}
    .filter-chip.calling.active{border-color:var(--calling-fg);background:var(--calling-fg);color:white;}

    /* BOOK LIST */
    #screen-books{padding:0;}
    .content-scroll{flex:1;overflow-y:auto;padding:12px 16px;}

    .school-section{margin-bottom:20px;}
    .school-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px 0;border-bottom:1px solid var(--border);}
    .school-badge{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px;font-weight:500;}
    .school-badge.gospel{background:var(--gospel-bg);color:var(--gospel-fg);}
    .school-badge.disciple{background:var(--disciple-bg);color:var(--disciple-fg);}
    .school-badge.calling{background:var(--calling-bg);color:var(--calling-fg);}
    .school-subject{font-size:12px;color:var(--muted);font-family:var(--font-mono);}

    .book-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s;}
    .book-card.done{background:var(--cream);}
    .book-card:hover{border-color:var(--olive-light);}

    .book-check{width:20px;height:20px;border:1.5px solid var(--border);border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .15s;}
    .book-check.checked{background:var(--olive);border-color:var(--olive);}
    .book-check.checked::after{content:'';width:5px;height:9px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);}

    .book-info{flex:1;min-width:0;}
    .book-title{font-weight:600;font-size:14px;line-height:1.4;}
    .book-title-ko{font-family:var(--font-serif);font-size:13px;color:var(--muted);}
    .book-author{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:3px;}
    .book-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
    .book-date{font-family:var(--font-mono);font-size:10px;color:var(--olive);margin-top:4px;}
    .book-meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
    .book-tag{font-family:var(--font-mono);font-size:9px;padding:2px 6px;border-radius:2px;letter-spacing:.05em;}

    .book-actions{display:flex;gap:4px;flex-direction:column;align-items:flex-end;}
    .btn-pdf{display:flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid var(--olive);border-radius:var(--radius);background:none;color:var(--olive);font-family:var(--font-mono);font-size:10px;cursor:pointer;text-decoration:none;transition:all .15s;white-space:nowrap;}
    .btn-pdf:hover{background:var(--olive);color:white;}
    .btn-icon{width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--muted);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .btn-icon:hover{background:var(--cream);color:var(--rust);}

    .empty-state{text-align:center;padding:48px 24px;color:var(--muted);}
    .empty-state-title{font-family:var(--font-serif);font-size:22px;margin-bottom:8px;}
    .empty-state-sub{font-size:13px;}

    /* PROGRESS */
    #screen-progress{padding:0;}
    .stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
    .stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;}
    .stat-num{font-family:var(--font-serif);font-size:36px;line-height:1;letter-spacing:-1px;color:var(--olive);}
    .stat-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px;}

    /* step progress bars */
    .step-progress-wrap{padding:0 16px 16px;}
    .step-progress-title{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
    .step-row{margin-bottom:10px;}
    .step-row-header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
    .step-row-label{font-weight:500;}
    .step-row-count{font-family:var(--font-mono);color:var(--muted);}
    .progress-bar{height:6px;background:var(--cream);border-radius:3px;overflow:hidden;}
    .progress-fill{height:100%;background:var(--olive);border-radius:3px;transition:width .5s ease;}
    .progress-fill.gospel{background:var(--gospel-fg);}
    .progress-fill.disciple{background:var(--disciple-fg);}
    .progress-fill.calling{background:var(--calling-fg);}

    .cal-wrap{padding:0 16px 16px;}
    .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
    .cal-title{font-family:var(--font-serif);font-size:18px;}
    .cal-nav-btn{width:28px;height:28px;border:1px solid var(--border);border-radius:var(--radius);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s;}
    .cal-nav-btn:hover{background:var(--cream);}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
    .cal-dow{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:4px 0;}
    .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;border-radius:50%;color:var(--ink);cursor:default;}
    .cal-day.other-month{color:var(--border);}
    .cal-day.done{background:var(--olive);color:white;font-weight:500;}
    .cal-day.today{border:1.5px solid var(--olive);}

    /* LEADERBOARD */
    #screen-leader{padding:0;}
    .leader-filter{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--white);}
    .leader-filter select{width:auto;padding:6px 10px;font-size:13px;}
    .matrix-scroll{flex:1;overflow:auto;}
    .matrix-table{width:max-content;min-width:100%;border-collapse:collapse;}
    .matrix-table th,.matrix-table td{padding:10px 14px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
    .matrix-table thead th{background:var(--white);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:0;border-bottom:2px solid var(--border);}
    .matrix-table thead th.name-col{position:sticky;left:0;z-index:2;text-align:left;}
    .matrix-table tbody td.name-col{position:sticky;left:0;background:var(--white);font-weight:600;text-align:left;z-index:1;}
    .matrix-table tbody tr:nth-child(even) td{background:var(--cream);}
    .matrix-table tbody tr:nth-child(even) td.name-col{background:var(--cream);}
    .check-v{color:var(--olive);font-weight:700;font-size:16px;}
    .check-dash{color:var(--border);}
    .total-cell{font-family:var(--font-mono);font-weight:500;color:var(--olive);}

    /* MODAL */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,26,24,.5);z-index:200;align-items:flex-end;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--white);border-radius:12px 12px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;animation:slideUp .25s ease;}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0;}}
    .modal-title{font-family:var(--font-serif);font-size:22px;margin-bottom:20px;}
    .modal-actions{display:flex;gap:8px;margin-top:20px;}
    .btn-secondary{flex:1;padding:11px;border:1px solid var(--border);border-radius:var(--radius);background:none;cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:all .15s;}
    .btn-secondary:hover{background:var(--cream);}
    .btn-save{flex:2;padding:11px;background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius);cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:opacity .15s;}
    .btn-save:hover{opacity:.85;}

    /* MISC */
    .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--olive-light);display:inline-block;}
    .sync-dot.offline{background:var(--muted);}
    .sync-dot.syncing{animation:pulse 1s infinite;background:var(--olive);}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
    .btn-text{background:none;border:none;cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
    .btn-text:hover{color:var(--ink);}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:var(--radius);font-family:var(--font-mono);font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:300;}
    .toast.show{opacity:1;}

    /* mobile */
    @media(max-width:480px){
      .login-title{font-size:36px;}
      .step-chips .step-chip{font-size:10px;padding:7px 4px;}
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <!-- ══ LOGIN ══ -->
  <div class="screen active" id="screen-login">
    <div class="login-wrap">
      <div class="login-title" id="login-title">Triple<br>School</div>
      <div class="login-sub" id="login-sub">독서 기록 Reading Tracker</div>

      <div class="form-group">
        <label>이름 Name</label>
        <input type="text" id="input-name" placeholder="홍길동">
      </div>
      <div class="form-group">
        <label>그룹 Group</label>
        <select id="input-group">
          <option>Blinn Intogen</option>
          <option>Renewgen</option>
          <option>Teachers</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>나의 단계 My Step</label>
        <div class="step-chips">
          <div class="step-chip selected" data-step="1" onclick="selectStep(this)">Step 1<br><span style="font-size:9px;opacity:.7;">초등 하</span></div>
          <div class="step-chip" data-step="2" onclick="selectStep(this)">Step 2<br><span style="font-size:9px;opacity:.7;">초등 상</span></div>
          <div class="step-chip" data-step="3" onclick="selectStep(this)">Step 3<br><span style="font-size:9px;opacity:.7;">중등</span></div>
          <div class="step-chip" data-step="4" onclick="selectStep(this)">Step 4<br><span style="font-size:9px;opacity:.7;">고등/성인</span></div>
        </div>
        <div class="step-info" id="step-info"></div>
      </div>
      <div class="form-group">
        <label>Role</label>
        <div class="role-chips">
          <div class="role-chip selected" data-role="student" onclick="selectRole(this)">Student</div>
          <div class="role-chip" data-role="leader" onclick="selectRole(this)">Leader</div>
        </div>
      </div>

      <button class="btn-primary" id="btn-login" onclick="doLogin()">Start</button>
      <div class="offline-note" id="offline-note">Firebase 미연결 — 로컬 저장 모드로 실행 중</div>
    </div>
  </div>

  <!-- ══ MAIN ══ -->
  <div class="screen" id="screen-main">

    <div class="top-bar">
      <span class="top-bar-title" id="topbar-title">도서 목록</span>
      <div class="top-bar-right">
        <span class="sync-dot" id="sync-dot"></span>
        <button class="btn-text" onclick="syncNow()">동기화</button>
        <span class="badge" id="role-badge">학생</span>
        <button class="btn-text" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <div class="notice-banner" id="notice-banner">
      <div class="notice-banner-title">📢 공지사항</div>
      <div id="notice-list"></div>
    </div>

    <!-- BOOKS TAB -->
    <div id="tab-books" class="tab-content" style="display:flex;flex-direction:column;flex:1;">
      <div class="filter-bar" id="filter-bar">
        <button class="filter-chip active" data-filter="all" onclick="setFilter(this,'all')">전체 All</button>
        <button class="filter-chip gospel" data-filter="Gospel" onclick="setFilter(this,'Gospel')">Gospel School</button>
        <button class="filter-chip disciple" data-filter="Disciple" onclick="setFilter(this,'Disciple')">Disciple School</button>
        <button class="filter-chip calling" data-filter="Calling" onclick="setFilter(this,'Calling')">Calling School</button>
        <button class="filter-chip" data-filter="done" onclick="setFilter(this,'done')">✓ 완독</button>
        <button class="filter-chip" data-filter="todo" onclick="setFilter(this,'todo')">○ 미완</button>
      </div>
      <div class="content-scroll" id="book-list"></div>
    </div>

  3: 'Step 3 — Middle School: 구원의 역사, 개혁신학 입문',
  4: 'Step 4 — High School / Adult: 심화 신학, 선교학, 소명',
};

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let state = {
  user: null,
  books: [], records: [], users: [],
  activeFilter: 'all',
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
};

const LS_KEY  = 'triple_v1';
const ADM_KEY = 'triple_admin';

function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    if (d.books)   state.books   = d.books;
    if (d.records) state.records = d.records;
    if (d.users)   state.users   = d.users;
    if (d.user)    { state.user  = d.user; return true; }
  } catch(e) {}
  return false;
}

function saveLocal() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    user: state.user, books: state.books,
    records: state.records, users: state.users,
  }));
}

// ═══════════════════════════════════════════
// EFFECTIVE BOOK LIST
// merges curriculum + admin-added custom books
// ═══════════════════════════════════════════
function getEffectiveBooks(stepFilter) {
  // pull pdf_url overrides admin saved
  let adm = {};
  try { adm = JSON.parse(localStorage.getItem(ADM_KEY) || '{}'); } catch(e){}
  const pdfOverrides = adm.pdfOverrides || {};

  // curriculum for user's step (or all if leader)
  const step = stepFilter || (state.user?.step || 4);
  let base = CURRICULUM
    .filter(b => b.step === Number(step))
    .map(b => ({
      ...b,
      pdfUrl: pdfOverrides[b.id] || b.pdfUrl,
      isCustom: false,
    }));

  // merge custom books added by leaders
  const custom = state.books.map(b => ({...b, isCustom: true}));
  return [...base, ...custom];
}

// ═══════════════════════════════════════════
// ADMIN SETTINGS
// ═══════════════════════════════════════════
function loadAdminSettings() {
  try {
    const adm = JSON.parse(localStorage.getItem(ADM_KEY) || '{}');
    if (adm.theme && adm.theme !== 'default') {
      document.documentElement.setAttribute('data-theme', adm.theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    if (adm.appName) {
      document.title = adm.appName;
      const el = document.getElementById('login-title');
      if (el) el.textContent = adm.appName;
    }
    if (adm.appSub) {
      const el = document.getElementById('login-sub');
      if (el) el.textContent = adm.appSub;
    }
    const notices = adm.notices || [];
    const banner = document.getElementById('notice-banner');
    const list   = document.getElementById('notice-list');
    if (notices.length && banner && list) {
      banner.classList.add('visible');
      list.innerHTML = notices.map(n => `
        <div class="notice-item">
          <div class="notice-item-title">${esc(n.title)}</div>
          <div class="notice-item-body">${esc(n.body)}</div>
          <div class="notice-item-meta">${n.group ? n.group+' · ' : ''}${n.date}</div>
        </div>`).join('');
    } else if (banner) {
      banner.classList.remove('visible');
    }
    if (adm.groups?.length) {
      ['input-group','filter-group'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const base = id === 'filter-group' ? '<option value="">모든 그룹 All Groups</option>' : '';
        el.innerHTML = base + adm.groups.map(g => `<option>${esc(g)}</option>`).join('');
      });
    }
  } catch(e) {}
}

// ═══════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════
let selectedRole = 'student';
let selectedStep = 1;

function selectRole(el) {
  document.querySelectorAll('.role-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedRole = el.dataset.role;
}

function selectStep(el) {
  document.querySelectorAll('.step-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedStep = parseInt(el.dataset.step);
  const info = document.getElementById('step-info');
  info.textContent = STEP_INFO[selectedStep];
  info.classList.add('visible');
}

function doLogin() {
  const name  = document.getElementById('input-name').value.trim();
  const group = document.getElementById('input-group').value;
  if (!name) { showToast('이름을 입력해주세요'); return; }

  const existing = state.users.find(u => u.name === name && u.group === group);
  let user;
  if (existing) {
    user = { ...existing, step: existing.step || selectedStep };
  } else {
    user = { id: uid(), name, group, role: selectedRole, step: selectedStep };
    state.users.push(user);
  }
  state.user = user;
  saveLocal();
  if (window.__firebaseReady) syncNow();
  enterApp();
}

function enterApp() {
  loadAdminSettings();
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  const badge = document.getElementById('role-badge');
  badge.textContent = state.user.role === 'leader' ? '리더' : '학생';
  badge.className   = 'badge' + (state.user.role === 'leader' ? ' leader' : '');
  renderBooks();
  updateSyncDot();
}

function logout() {
  state.user = null;
  saveLocal();
  location.reload();
}

// ═══════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════
const tabTitles = { books: '도서 목록', progress: '내 진도', leader: '리더보드' };

function switchTab(tab) {
  ['books','progress','leader'].forEach(t => {
    document.getElementById('tab-'+t).style.display = 'none';
    document.getElementById('nav-'+t).classList.remove('active');
  });
  document.getElementById('tab-'+tab).style.display = 'flex';
  document.getElementById('nav-'+tab).classList.add('active');
  document.getElementById('topbar-title').textContent = tabTitles[tab];
  if (tab === 'progress') renderProgress();
  if (tab === 'leader')   renderLeader();
}

// ═══════════════════════════════════════════
// FILTER
// ═══════════════════════════════════════════
function setFilter(el, filter) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  state.activeFilter = filter;
  renderBooks();
}

// ═══════════════════════════════════════════
// BOOKS
// ═══════════════════════════════════════════
function renderBooks() {
  const list = document.getElementById('book-list');
  const myRecords = state.records.filter(r => r.userId === state.user.id);
  const doneIds = new Set(myRecords.map(r => r.bookId));

  // leader sees all steps; student sees own step
  const stepFilter = state.user.role === 'leader' ? null : state.user.step;
  let books = getEffectiveBooks(stepFilter);

  // apply filter
  if (state.activeFilter === 'Gospel')   books = books.filter(b => b.course === 'Gospel');
  if (state.activeFilter === 'Disciple') books = books.filter(b => b.course === 'Disciple');
  if (state.activeFilter === 'Calling')  books = books.filter(b => b.course === 'Calling');
  if (state.activeFilter === 'done')     books = books.filter(b => doneIds.has(b.id));
  if (state.activeFilter === 'todo')     books = books.filter(b => !doneIds.has(b.id));

  if (!books.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-state-title">도서 없음</div>
      <div class="empty-state-sub">필터를 변경하거나 리더가 책을 추가할 예정이에요</div>
    </div>`;
    return;
  }

  // group by course → subject
  const schools = ['Gospel','Disciple','Calling'];
  const schoolLabels = {Gospel:'Gospel School',Disciple:'Disciple School',Calling:'Calling School'};
  let html = '';

  schools.forEach(school => {
    const schoolBooks = books.filter(b => b.course === school);
    if (!schoolBooks.length) return;

    // group by subject
    const subjects = [...new Set(schoolBooks.map(b => b.subject))];
    subjects.forEach(subject => {
      const subjectBooks = schoolBooks.filter(b => b.subject === subject);
      html += `<div class="school-section">
        <div class="school-header">
          <span class="school-badge ${school.toLowerCase()}">${schoolLabels[school]}</span>
          <span class="school-subject">${subject}</span>
        </div>`;
      subjectBooks.forEach(book => {
        const done = doneIds.has(book.id);
        const rec  = myRecords.find(r => r.bookId === book.id);
        html += `<div class="book-card ${done ? 'done' : ''}" id="card-${book.id}">
          <div class="book-check ${done ? 'checked' : ''}" onclick="toggleBook('${book.id}')"></div>
          <div class="book-info">
            <div class="book-title">${esc(book.title)}</div>
            ${book.titleKo ? `<div class="book-title-ko">${esc(book.titleKo)}</div>` : ''}
            ${book.author  ? `<div class="book-author">${esc(book.author)}</div>` : ''}
            ${rec          ? `<div class="book-date">✓ ${rec.date}</div>` : ''}
          </div>
          <div class="book-actions">
            ${book.pdfUrl ? `<a class="btn-pdf" href="${esc(book.pdfUrl)}" target="_blank" rel="noopener">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
              PDF
            </a>` : ''}
            ${(state.user.role === 'leader' && book.isCustom) ? `
            <button class="btn-icon" onclick="deleteBook('${book.id}')" title="삭제">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>` : ''}
          </div>
        </div>`;
      });
      html += `</div>`;
    });
  });

  // leader: add custom books FAB
  if (state.user.role === 'leader') {
    html += `<div style="padding:16px 0 48px; text-align:center;">
      <button onclick="openAddBook()" style="padding:10px 20px;border:1px dashed var(--border);border-radius:var(--radius);background:none;cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--muted);">
        + 책 추가 Add Book
      </button>
    </div>`;
  }

  list.innerHTML = html;
}

function toggleBook(bookId) {
  const userId = state.user.id;
  const idx = state.records.findIndex(r => r.userId === userId && r.bookId === bookId);
  if (idx >= 0) {
    state.records.splice(idx, 1);
    if (window.__firebaseReady) fsDeleteRecord(userId, bookId);
  } else {
    const rec = { userId, bookId, date: today() };
    state.records.push(rec);
    if (window.__firebaseReady) fsUpsertRecord(rec);
  }
  saveLocal();
  renderBooks();
}

function deleteBook(bookId) {
  state.books   = state.books.filter(b => b.id !== bookId);
  state.records = state.records.filter(r => r.bookId !== bookId);
  saveLocal();
  if (window.__firebaseReady) {
    const { doc, deleteDoc } = window.__fsModules;
    deleteDoc(doc(window.__db, 'books', bookId));
  }
  renderBooks();
}

// ═══════════════════════════════════════════
// ADD BOOK (leader — custom)
// ═══════════════════════════════════════════
function openAddBook() {
  document.getElementById('modal-add').classList.add('open');
}
function closeModal(e) {
  if (e.target.classList.contains('modal-overlay'))
    e.target.classList.remove('open');
}

function saveBook() {
  const titleKo = document.getElementById('m-title-ko').value.trim();
  const title   = document.getElementById('m-title').value.trim();
  const author  = document.getElementById('m-author').value.trim();
  const course  = document.getElementById('m-course').value;
  const subject = document.getElementById('m-subject').value;
  const step    = parseInt(document.getElementById('m-step').value);
  const pdfUrl  = document.getElementById('m-pdf').value.trim();
  if (!titleKo && !title) { showToast('제목을 입력하세요'); return; }

  const book = { id: uid(), title: title||titleKo, titleKo, author, course, subject, step, pdfUrl };
  state.books.push(book);
  saveLocal();
  if (window.__firebaseReady) fsUpsertBook(book);

  document.getElementById('modal-add').classList.remove('open');
  ['m-title-ko','m-title','m-author','m-pdf'].forEach(id => document.getElementById(id).value='');
  renderBooks();
  showToast('추가됐어 ✓');
}

// ═══════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════
function renderProgress() {
  const myRecords = state.records.filter(r => r.userId === state.user.id);
  const doneDates = new Set(myRecords.map(r => r.date));
  const doneIds   = new Set(myRecords.map(r => r.bookId));

  document.getElementById('stat-total').textContent  = myRecords.length;
  document.getElementById('stat-streak').textContent = calcStreak(doneDates);

  // school progress bars
  const stepBooks = getEffectiveBooks(state.user.step);
  const schools   = ['Gospel','Disciple','Calling'];
  const labels    = {Gospel:'Gospel School',Disciple:'Disciple School',Calling:'Calling School'};
  let progressHTML = '';
  schools.forEach(school => {
    const total = stepBooks.filter(b => b.course === school).length;
    const done  = stepBooks.filter(b => b.course === school && doneIds.has(b.id)).length;
    const pct   = total ? Math.round(done / total * 100) : 0;
    progressHTML += `<div class="step-row">
      <div class="step-row-header">
        <span class="step-row-label">${labels[school]}</span>
        <span class="step-row-count">${done} / ${total}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill ${school.toLowerCase()}" style="width:${pct}%"></div>
      </div>
    </div>`;
  });
  document.getElementById('school-progress').innerHTML = progressHTML;

  renderCalendar(doneDates);
}

function calcStreak(doneDates) {
  let streak = 0;
  const now = new Date();
  for (let w = 0; w < 52; w++) {
    const mon = new Date(now);
    mon.setDate(mon.getDate() - mon.getDay() + 1 - w * 7);
    const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
    const hasRead = [...doneDates].some(d => {
      const dt = new Date(d); return dt >= mon && dt <= sun;
    });
    if (!hasRead) break;
    streak++;
  }
  return streak;
}

function renderCalendar(doneDates) {
  const {calYear:y, calMonth:m} = state;
  const months_ko = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cal-title').textContent = `${y}년 ${months_ko[m]}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  ['일','월','화','수','목','금','토'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow'; el.textContent = d; grid.appendChild(el);
  });
  const first    = new Date(y, m, 1).getDay();
  const days     = new Date(y, m+1, 0).getDate();
  const todayStr = today();
  for (let i = 0; i < first; i++) {
    const el = document.createElement('div'); el.className = 'cal-day other-month'; grid.appendChild(el);
  }
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div');
    let cls = 'cal-day';
    if (doneDates.has(ds)) cls += ' done';
    if (ds === todayStr)   cls += ' today';
    el.className = cls; el.textContent = d; grid.appendChild(el);
  }
}

function calPrev() {
  state.calMonth--;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  renderCalendar(new Set(state.records.filter(r=>r.userId===state.user.id).map(r=>r.date)));
}
function calNext() {
  state.calMonth++;
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  renderCalendar(new Set(state.records.filter(r=>r.userId===state.user.id).map(r=>r.date)));
}

// ═══════════════════════════════════════════
// LEADERBOARD
// ═══════════════════════════════════════════
function renderLeader() {
  const fg = document.getElementById('filter-group').value;
  let users = state.users.filter(u => u.role === 'student');
  if (fg) users = users.filter(u => u.group === fg);

  const table = document.getElementById('matrix-table');
  if (!users.length) {
    table.innerHTML = `<tr><td colspan="99" style="padding:40px;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:12px;">데이터 없음 No data</td></tr>`;
    return;
  }

  // show all step 4 books as columns for leaderboard
  const books = getEffectiveBooks(null) ;
  // limit to step4 for cleaner view, but show all steps as separate sections
  const thead = `<thead><tr>
    <th class="name-col">이름</th>
    <th>그룹</th>
    <th>Step</th>
    <th>완독</th>
    <th>진도%</th>
  </tr></thead>`;

  const tbody = users.map(user => {
    const userRecs  = state.records.filter(r => r.userId === user.id);
    const userStep  = user.step || 4;
    const stepBooks = getEffectiveBooks(userStep);
    const pct = stepBooks.length ? Math.round(userRecs.filter(r => stepBooks.some(b=>b.id===r.bookId)).length / stepBooks.length * 100) : 0;
    return `<tr>
      <td class="name-col">${esc(user.name)}</td>
      <td style="font-family:var(--font-mono);font-size:11px;">${esc(user.group)}</td>
      <td style="font-family:var(--font-mono);font-size:11px;">Step ${userStep}</td>
      <td class="total-cell">${userRecs.length}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="flex:1;height:4px;background:var(--cream);border-radius:2px;min-width:60px;">
            <div style="width:${pct}%;height:100%;background:var(--olive);border-radius:2px;"></div>
          </div>
          <span style="font-family:var(--font-mono);font-size:10px;color:var(--muted);">${pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  table.innerHTML = thead + '<tbody>' + tbody + '</tbody>';
}

// ═══════════════════════════════════════════
// FIREBASE SYNC
// ═══════════════════════════════════════════
function setSyncDot(s) {
  const dot = document.getElementById('sync-dot');
  if (dot) dot.className = 'sync-dot ' + s;
}
function updateSyncDot() { setSyncDot(window.__firebaseReady ? 'active' : 'offline'); }

async function syncNow() {
  if (!window.__firebaseReady) { showToast('Firebase 미연결 (오프라인 모드)'); return; }
  setSyncDot('syncing');
  try {
    await Promise.all([fsPushUsers(),fsPushBooks(),fsPushRecords(),fsPullBooks(),fsPullRecords(),fsPullUsers()]);
    saveLocal(); renderBooks();
    setSyncDot('active'); showToast('동기화 완료');
  } catch(e) { setSyncDot('offline'); showToast('동기화 실패'); }
}

async function fsPushUsers() {
  const {collection:col,doc,setDoc} = window.__fsModules;
  for (const u of state.users) await setDoc(doc(window.__db,'users',u.id),u);
}
async function fsPushBooks() {
  const {doc,setDoc} = window.__fsModules;
  for (const b of state.books) await setDoc(doc(window.__db,'books',b.id),b);
}
async function fsPushRecords() {
  const {doc,setDoc} = window.__fsModules;
  for (const r of state.records) await setDoc(doc(window.__db,'read_records',r.userId+'_'+r.bookId),r);
}
async function fsPullBooks() {
  const {collection:col,getDocs} = window.__fsModules;
  const snap = await getDocs(col(window.__db,'books'));
  snap.forEach(d => { const data=d.data(); if(!state.books.find(b=>b.id===data.id)) state.books.push(data); });
}
async function fsPullRecords() {
  const {collection:col,getDocs} = window.__fsModules;
  const snap = await getDocs(col(window.__db,'read_records'));
  snap.forEach(d => { const data=d.data(); const key=r=>r.userId+'_'+r.bookId; if(!state.records.find(r=>key(r)===key(data))) state.records.push(data); });
}
async function fsPullUsers() {
  const {collection:col,getDocs} = window.__fsModules;
  const snap = await getDocs(col(window.__db,'users'));
  snap.forEach(d => { const data=d.data(); if(!state.users.find(u=>u.id===data.id)) state.users.push(data); });
}
async function fsUpsertBook(book) {
  const {doc,setDoc} = window.__fsModules;
  await setDoc(doc(window.__db,'books',book.id),book);
}
async function fsUpsertRecord(rec) {
  const {doc,setDoc} = window.__fsModules;
  await setDoc(doc(window.__db,'read_records',rec.userId+'_'+rec.bookId),rec);
}
async function fsDeleteRecord(userId,bookId) {
  const {doc,deleteDoc} = window.__fsModules;
  await deleteDoc(doc(window.__db,'read_records',userId+'_'+bookId));
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today() {
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
loadAdminSettings();

document.addEventListener('firebase-ready', () => {
  document.getElementById('offline-note').textContent =
    window.__firebaseReady ? 'Firebase 연결됨 ✓' : 'Firebase 미연결 — 로컬 모드 Offline mode';
});

if (loadLocal() && state.user) {
  document.getElementById('screen-login').classList.remove('active');
  enterApp();
} else {
  loadLocal();
}
</script>
